name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: dotnet restore TransferProof.slnx
      - run: dotnet build TransferProof.slnx --no-restore -c Release
      - run: dotnet test TransferProof.slnx --no-build -c Release
